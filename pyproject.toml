[tool.poetry]
name = "json-extractor"
version = "0.1.0"
description = "eats text and json and gives that text in that json format"
authors = ["Prakhar Jaiman <prakharjaiman@github.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "3.13.3"
fastapi = "^0.115.12"
groq = "^0.23.1"
pydantic = "^2.11.4"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
